spring.application.name=click2buy

spring.datasource.url=${CLICK2BUY_DATASOURCE_URL}
spring.datasource.username=${CLICK2BUY_DATASOURCE_USERNAME}
spring.datasource.password=${CLICK2BUY_DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update

melhorenvio.client-id=${MELHOR_ENVIO_CLIENT_ID}
melhorenvio.client-secret=${MELHOR_ENVIO_CLIENT_SECRET}
melhorenvio.redirect-uri=${MELHOR_ENVIO_REDIRECT_URI}
melhorenvio.api-base-url=${MELHOR_ENVIO_API_BASE_URL:https://sandbox.melhorenvio.com.br/}
melhorenvio.auth-url=${MELHOR_ENVIO_AUTH_URL:https://sandbox.melhorenvio.com.br/oauth/token}

#props do redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

#jwt secret
jwt.secret=${JWT_SECRET}
