spring.application.name=click2buy
server.port=8080

spring.datasource.url=${CLICK2BUY_DATASOURCE_URL}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

superfrete.api-token=${SUPERFRETE_API_TOKEN}
superfrete.api-base-url=${SUPERFRETE_API_BASE_URL:https://sandbox.superfrete.com/api/v0}

#props do redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=6379

#jwt secret
jwt.secret=${JWT_SECRET}

#stripe props
stripe.secret.key=${STRIPE_SECRET_KEY}